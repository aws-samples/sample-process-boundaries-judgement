[project]
name = "governed-reasoning-poc"
version = "0.1.0"
description = "Schema-bounded reasoning record POC with adversarial validation"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
gr = "governed_reasoning.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_reasoning"]
